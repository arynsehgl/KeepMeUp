# Tests every proposed change and produces an unsigned Universal DMG for inspection.
name: Build

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Package Universal app
        run: bash scripts/package_app.sh

      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: KeepMeUp-unsigned
          path: |
            dist/*.dmg
            dist/*.sha256
