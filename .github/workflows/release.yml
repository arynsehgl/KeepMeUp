# Publishes a manually installable unsigned build whenever an explicitly created version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Package Universal app
        run: bash scripts/package_app.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.sha256 --generate-notes --verify-tag
